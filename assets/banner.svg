<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    /* Subtle background dynamic wave & orb animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(-15px, 20px); opacity: 0.75; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
    }
    @keyframes pulsePurple {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.22) translate(25px, -15px); opacity: 0.7; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .orb-blue {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-purple {
      transform-origin: 1000px 280px;
      animation: pulsePurple 9s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8 16;
      animation: dashTravel 4s linear infinite;
    }
    .pill-floating-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-floating-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-floating-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
    .pill-floating-4 { animation: floatPill 6.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#cyber-grid)"/>

  <!-- Animated Glowing Ambience (Strictly in Background) -->
  <g filter="url(#glow-blur)" opacity="0.6">
    <circle class="orb-blue" cx="220" cy="120" r="140" fill="#3b82f6"/>
    <circle class="orb-purple" cx="980" cy="270" r="160" fill="#9333ea"/>
    <circle cx="600" cy="380" r="120" fill="#06b6d4" opacity="0.3"/>
  </g>

  <!-- Animated Background Connection Edges (Knowledge Graph Aesthetic) -->
  <g opacity="0.35">
    <path d="M 80 80 Q 300 200 600 70 T 1120 120" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line"/>
    <path d="M 120 340 Q 400 180 750 350 T 1140 260" fill="none" stroke="#a855f7" stroke-width="2" class="stream-line" style="animation-duration: 6s;"/>
    <!-- Knowledge Graph Graph Nodes -->
    <circle cx="160" cy="90" r="5" fill="#38bdf8"/>
    <circle cx="340" cy="180" r="4" fill="#818cf8"/>
    <circle cx="860" cy="110" r="5" fill="#c084fc"/>
    <circle cx="1060" cy="130" r="6" fill="#38bdf8"/>
    <circle cx="280" cy="310" r="5" fill="#a855f7"/>
    <circle cx="720" cy="330" r="4" fill="#34d399"/>
    <circle cx="1020" cy="290" r="5" fill="#f43f5e"/>
  </g>

  <!-- Central Foreground Content Container (Guaranteed Unobscured Foreground) -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Top Pill Category Header -->
    <g transform="translate(0, -68)">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1"/>
      <circle cx="-152" cy="0" r="5" fill="#10b981"/>
      <text x="8" y="5" text-anchor="middle" class="badge-pill-text" fill="#38bdf8">⚡ CURATED REPOSITORY &amp; ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Glow -->
    <text y="0" text-anchor="middle" class="title-text" fill="url(#text-grad)" filter="url(#soft-glow)">
      Automated Code Review &amp; Knowledge Graphs
    </text>
    <text y="0" text-anchor="middle" class="title-text" fill="url(#text-grad)">
      Automated Code Review &amp; Knowledge Graphs
    </text>

    <!-- Subtitle -->
    <text y="44" text-anchor="middle" class="subtitle-text">
      AI Pull Request Intelligence • Codebase Knowledge Graphs • DevSecOps
    </text>

    <!-- Decorative Line Indicator -->
    <line x1="-120" y1="72" x2="120" y2="72" stroke="url(#text-grad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Interactive Dynamic Bottom Feature Badges (Aligned neatly below text, unobtrusive) -->
  <g transform="translate(600, 320)" text-anchor="middle">
    <!-- Pill 1: AI PR Reviews -->
    <g transform="translate(-360, 0)" class="pill-floating-1">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="url(#pill-grad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
      <text y="5" text-anchor="middle" class="badge-pill-text" fill="#c7d2fe">🤖 AI PR Reviews</text>
    </g>

    <!-- Pill 2: Code Knowledge Graphs -->
    <g transform="translate(-120, 0)" class="pill-floating-2">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="url(#pill-grad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
      <text y="5" text-anchor="middle" class="badge-pill-text" fill="#e9d5ff">🕸️ Code Knowledge Graphs</text>
    </g>

    <!-- Pill 3: MCP & Coding Agents -->
    <g transform="translate(130, 0)" class="pill-floating-3">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="url(#pill-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <text y="5" text-anchor="middle" class="badge-pill-text" fill="#bae6fd">🔌 MCP Coding Agents</text>
    </g>

    <!-- Pill 4: Self-Hosted & OSS -->
    <g transform="translate(365, 0)" class="pill-floating-4">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="url(#pill-grad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
      <text y="5" text-anchor="middle" class="badge-pill-text" fill="#a7f3d0">🛡️ Self-Hosted &amp; OSS</text>
    </g>
  </g>

  <!-- Border Trim -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
</svg>
